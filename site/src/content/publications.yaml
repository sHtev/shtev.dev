# --- PhD and follow-on work (York, then Newcastle with Michael Harrison) ---
- id: phd-thesis
  title: Specifying the Ubiquitous User Interface Using Interaction Style
  authors: [Stephen W. Gilroy]
  venue: PhD thesis, University of York, Department of Computer Science
  year: 2006
  group: phd
  kind: thesis
  openUrl: /research/gilroy-phd-thesis.pdf
  selected: true
  order: 0
  summary: >-
    One description of an application's interface, which adapts itself to whatever device you have to hand
    (a phone, a PDA, a desktop or a voice system) by choosing a suitable interaction style, such as menus,
    forms or a step-by-step wizard. The thesis defines a language for those descriptions and a working
    prototype system that runs them.

