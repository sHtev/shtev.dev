name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC login to AWS

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ALLOW_PLACEHOLDER_CV: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Site tests
        working-directory: site
        env:
          GO_LIVE: "1" # the site is public: no page may still be a draft
        run: |
          npm ci
          npm run check
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Lambda tests
        working-directory: lambda/contact
        run: |
          npm ci
          npm test
          npm run typecheck
      - run: node --test 'infra/main/functions/*.test.mjs'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production # the deploy role only trusts this environment
    env:
      TF_VAR_budget_email: ${{ secrets.TF_VAR_BUDGET_EMAIL }}
      TF_VAR_contact_email: ${{ secrets.TF_VAR_CONTACT_EMAIL }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }} # a secret so logs mask it
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Build the contact Lambda
        working-directory: lambda/contact
        run: npm ci && npm run build
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false # plain stdout for `terraform output -raw`
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/shtev-dev-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform apply
        working-directory: infra/main
        run: |
          terraform init -input=false -backend-config="bucket=shtev-dev-tfstate-$AWS_ACCOUNT_ID"
          terraform apply -input=false -auto-approve
          echo "SITE_BUCKET=$(terraform output -raw site_bucket)" >> "$GITHUB_ENV"
          echo "PRIVATE_ASSETS_BUCKET=$(terraform output -raw private_assets_bucket)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"
      - name: Build the site (fetches the real CV from the private bucket)
        working-directory: site
        run: npm ci && npm run build
      - name: Upload and invalidate
        run: |
          aws s3 sync site/dist "s3://$SITE_BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
